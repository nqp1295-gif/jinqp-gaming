<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-grand-prix-apex" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#1F1704"/><stop offset="0.6" stop-color="#3B2C08"/><stop offset="1" stop-color="#100C02"/></linearGradient>
    <filter id="glow-grand-prix-apex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grand-prix-apex)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#EAB308" opacity="0.12" filter="url(#glow-grand-prix-apex)" />

  <!-- Focal Illustration -->
  
      <!-- Formula 1 Aerodynamic Single-Seater Nose & Checkered Flag -->
      <g transform="translate(400, 230)">
        <!-- Apex Curbs -->
        <path d="M-180 80 Q 0 20 180 80" stroke="#EF4444" stroke-width="12" stroke-dasharray="24 24" fill="none"/>
        <!-- F1 Car Top View Silhouette -->
        <path d="M0 -90 L12 -20 L35 0 L25 70 L-25 70 L-35 0 L-12 -20 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="3" filter="url(#glow-grand-prix-apex)"/>
        <!-- Front Wing -->
        <rect x="-60" y="-85" width="120" height="12" rx="3" fill="#18181B" stroke="#FDE047" stroke-width="2"/>
        <!-- Rear Wing -->
        <rect x="-50" y="60" width="100" height="14" rx="3" fill="#18181B" stroke="#FDE047" stroke-width="2"/>
        <!-- Helmet -->
        <circle cx="0" cy="15" r="9" fill="#EF4444"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#EAB308" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ĐUA XE</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>