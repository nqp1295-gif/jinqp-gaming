<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-shadow-strike" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#120A24"/><stop offset="0.6" stop-color="#221345"/><stop offset="1" stop-color="#090514"/></linearGradient>
    <filter id="glow-shadow-strike" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-shadow-strike)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#8B5CF6" opacity="0.12" filter="url(#glow-shadow-strike)" />

  <!-- Focal Illustration -->
  
      <!-- Ninja Shuriken & Stealth Crescent -->
      <g transform="translate(400, 230)">
        <!-- Giant Glowing Shuriken -->
        <g filter="url(#glow-shadow-strike)">
          <path d="M0 -90 L18 -25 L85 -25 L32 12 L50 80 L0 40 L-50 80 L-32 12 L-85 -25 L-18 -25 Z" fill="#8B5CF6" stroke="#C4B5FD" stroke-width="2"/>
          <circle cx="0" cy="8" r="18" fill="#1E1B4B" stroke="#A78BFA" stroke-width="3"/>
        </g>
        <!-- Shadow Slash Swirls -->
        <path d="M-130 50 Q 0 -120 130 50" stroke="#C084FC" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
        <path d="M-110 70 Q 0 -90 110 70" stroke="#DDD6FE" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#8B5CF6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">HÀNH ĐỘNG</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>