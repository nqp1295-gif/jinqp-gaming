<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-wormhole-warp" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#140826"/><stop offset="0.6" stop-color="#2A104F"/><stop offset="1" stop-color="#0A0414"/></linearGradient>
    <filter id="glow-wormhole-warp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-wormhole-warp)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#A855F7" opacity="0.12" filter="url(#glow-wormhole-warp)" />

  <!-- Focal Illustration -->
  
      <!-- Hyperspace Warp Speed Tunnel Rings -->
      <g transform="translate(400, 230)">
        <ellipse cx="0" cy="0" rx="130" ry="90" stroke="#A855F7" stroke-width="4" fill="none" opacity="0.3"/>
        <ellipse cx="0" cy="0" rx="95" ry="65" stroke="#C084FC" stroke-width="3.5" fill="none" opacity="0.5"/>
        <ellipse cx="0" cy="0" rx="60" ry="40" stroke="#E879F9" stroke-width="3" fill="none" opacity="0.7"/>
        <ellipse cx="0" cy="0" rx="30" ry="20" stroke="#FFFFFF" stroke-width="2" fill="#F472B6" filter="url(#glow-wormhole-warp)"/>
        <!-- Speed Streaks -->
        <line x1="-150" y1="-100" x2="-30" y2="-20" stroke="#38BDF8" stroke-width="2"/>
        <line x1="150" y1="-100" x2="30" y2="-20" stroke="#38BDF8" stroke-width="2"/>
        <line x1="-150" y1="100" x2="-30" y2="20" stroke="#38BDF8" stroke-width="2"/>
        <line x1="150" y1="100" x2="30" y2="20" stroke="#38BDF8" stroke-width="2"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#A855F7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">KHÔNG GIAN</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>