<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-whack-master" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#240710"/><stop offset="0.6" stop-color="#470D1E"/><stop offset="1" stop-color="#120308"/></linearGradient>
    <filter id="glow-whack-master" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-whack-master)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#E11D48" opacity="0.12" filter="url(#glow-whack-master)" />

  <!-- Focal Illustration -->
  
      <!-- Heavy Thunder Hammer Smashing Pad -->
      <g transform="translate(400, 230)">
        <!-- Ground Hole Ring -->
        <ellipse cx="0" cy="60" rx="100" ry="30" fill="#1C1917" stroke="#E11D48" stroke-width="3"/>
        <!-- Giant Hammer Swung Down -->
        <g transform="translate(-10, -20) rotate(-25)">
          <!-- Handle -->
          <rect x="-8" y="-100" width="16" height="120" rx="4" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
          <!-- Hammer Head -->
          <rect x="-55" y="10" width="110" height="60" rx="10" fill="#334155" stroke="#E11D48" stroke-width="4" filter="url(#glow-whack-master)"/>
          <line x1="-55" y1="40" x2="55" y2="40" stroke="#94A3B8" stroke-width="3"/>
        </g>
        <!-- Impact Stars -->
        <polygon points="60,30 68,45 85,45 72,55 77,70 60,60 43,70 48,55 35,45 52,45" fill="#FBBF24"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#E11D48" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#E11D48" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PHẢN XẠ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>