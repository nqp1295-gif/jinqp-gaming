<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-mars-lander" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#260F04"/><stop offset="0.6" stop-color="#4A1D09"/><stop offset="1" stop-color="#140702"/></linearGradient>
    <filter id="glow-mars-lander" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-mars-lander)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#EA580C" opacity="0.12" filter="url(#glow-mars-lander)" />

  <!-- Focal Illustration -->
  
      <!-- Mars Exploration Capsule & Lunar Landing Legs -->
      <g transform="translate(400, 230)">
        <!-- Mars Surface Dune -->
        <path d="M-180 80 Q 0 40 180 80" stroke="#EA580C" stroke-width="4" fill="#7C2D12"/>
        <!-- Lander Capsule -->
        <polygon points="-35,20 -25,-40 25,-40 35,20" fill="#D97706" stroke="#FDE68A" stroke-width="2.5" filter="url(#glow-mars-lander)"/>
        <circle cx="0" cy="-15" r="12" fill="#0284C7"/>
        <!-- Landing Strut Legs -->
        <line x1="-30" y1="20" x2="-65" y2="65" stroke="#E2E8F0" stroke-width="4"/>
        <circle cx="-65" cy="65" r="8" fill="#94A3B8"/>
        <line x1="30" y1="20" x2="65" y2="65" stroke="#E2E8F0" stroke-width="4"/>
        <circle cx="65" cy="65" r="8" fill="#94A3B8"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#EA580C" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">KHÔNG GIAN</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>