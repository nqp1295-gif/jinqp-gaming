<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-orbit" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0E0F2E"/><stop offset="0.6" stop-color="#1B1D59"/><stop offset="1" stop-color="#070817"/></linearGradient>
    <filter id="glow-orbit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-orbit)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#6366F1" opacity="0.12" filter="url(#glow-orbit)" />

  <!-- Focal Illustration -->
  
      <!-- Ringed Planet & Orbiting Space Shuttle -->
      <g transform="translate(400, 230)">
        <!-- Planet -->
        <circle cx="0" cy="0" r="65" fill="#4338CA" stroke="#818CF8" stroke-width="3" filter="url(#glow-orbit)"/>
        <!-- Orbit Rings -->
        <ellipse cx="0" cy="0" rx="140" ry="40" stroke="#A5B4FC" stroke-width="3" fill="none" transform="rotate(-15)"/>
        <!-- Shuttle on Orbit -->
        <g transform="translate(110, -25) rotate(45)">
          <polygon points="0,-18 10,12 -10,12" fill="#FFFFFF"/>
          <polygon points="0,12 5,20 -5,20" fill="#F43F5E"/>
        </g>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#6366F1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">KHÔNG GIAN</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>