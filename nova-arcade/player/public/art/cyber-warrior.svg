<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-cyber-warrior" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#051C24"/><stop offset="0.6" stop-color="#0B3747"/><stop offset="1" stop-color="#020E12"/></linearGradient>
    <filter id="glow-cyber-warrior" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-cyber-warrior)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#06B6D4" opacity="0.12" filter="url(#glow-cyber-warrior)" />

  <!-- Focal Illustration -->
  
      <!-- Cyber Mech Helmet Visor & Hex Shield -->
      <g transform="translate(400, 230)">
        <!-- Hex Shield -->
        <polygon points="0,-95 80,-45 80,45 0,95 -80,45 -80,-45" fill="#083344" stroke="#06B6D4" stroke-width="3" filter="url(#glow-cyber-warrior)"/>
        <!-- Inner Hex Grid -->
        <polygon points="0,-75 60,-35 60,35 0,75 -60,35 -60,-35" fill="#0E4A5E" stroke="#22D3EE" stroke-width="2"/>
        <!-- Glowing Visor Eye -->
        <rect x="-45" y="-10" width="90" height="20" rx="6" fill="#67E8F9" filter="url(#glow-cyber-warrior)"/>
        <line x1="-70" y1="0" x2="70" y2="0" stroke="#FFFFFF" stroke-width="2"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">HÀNH ĐỘNG</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>