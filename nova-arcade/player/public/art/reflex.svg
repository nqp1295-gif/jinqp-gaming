<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-reflex" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#041F28"/><stop offset="0.6" stop-color="#083747"/><stop offset="1" stop-color="#020E13"/></linearGradient>
    <filter id="glow-reflex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-reflex)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#00F0FF" opacity="0.12" filter="url(#glow-reflex)" />

  <!-- Focal Illustration -->
  
      <!-- Strobe Push Button & Lightning Waves -->
      <g transform="translate(400, 230)">
        <circle cx="0" cy="0" r="115" stroke="#00F0FF" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
        <circle cx="0" cy="0" r="85" fill="#082F3B" stroke="#00F0FF" stroke-width="4" filter="url(#glow-reflex)"/>
        <circle cx="0" cy="0" r="60" fill="#00F0FF" opacity="0.9"/>
        <!-- Central Lightning Zap -->
        <path d="M-10 -35 L12 -5 L-4 5 L10 35 L-12 5 L4 -5 Z" fill="#FFFFFF"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#00F0FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PHẢN XẠ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>