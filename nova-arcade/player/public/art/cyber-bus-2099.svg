<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-cyber-bus-2099" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#041F16"/><stop offset="0.6" stop-color="#093A2A"/><stop offset="1" stop-color="#02120D"/></linearGradient>
    <filter id="glow-cyber-bus-2099" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-cyber-bus-2099)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#10B981" opacity="0.12" filter="url(#glow-cyber-bus-2099)" />

  <!-- Focal Illustration -->
  
      <!-- Flying Double-Decker Aerobus -->
      <g transform="translate(400, 230)">
        <!-- Bus Body -->
        <rect x="-85" y="-60" width="170" height="95" rx="16" fill="#064E3B" stroke="#10B981" stroke-width="3" filter="url(#glow-cyber-bus-2099)"/>
        <!-- Window strips -->
        <rect x="-70" y="-45" width="140" height="20" rx="4" fill="#6EE7B7" opacity="0.8"/>
        <rect x="-70" y="-15" width="140" height="20" rx="4" fill="#6EE7B7" opacity="0.8"/>
        <!-- Hover Thruster Jets -->
        <rect x="-75" y="35" width="35" height="12" rx="3" fill="#047857"/>
        <rect x="40" y="35" width="35" height="12" rx="3" fill="#047857"/>
        <ellipse cx="-57" cy="48" rx="14" ry="6" fill="#00F0FF" filter="url(#glow-cyber-bus-2099)"/>
        <ellipse cx="57" cy="48" rx="14" ry="6" fill="#00F0FF" filter="url(#glow-cyber-bus-2099)"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ĐUA XE</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>