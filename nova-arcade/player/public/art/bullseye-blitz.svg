<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-bullseye-blitz" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#240707"/><stop offset="0.6" stop-color="#450E0E"/><stop offset="1" stop-color="#120303"/></linearGradient>
    <filter id="glow-bullseye-blitz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-bullseye-blitz)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#DC2626" opacity="0.12" filter="url(#glow-bullseye-blitz)" />

  <!-- Focal Illustration -->
  
      <!-- 100-pt Target & Laser Dart Hit -->
      <g transform="translate(400, 230)">
        <circle cx="0" cy="0" r="110" fill="#1C1917" stroke="#DC2626" stroke-width="4"/>
        <circle cx="0" cy="0" r="85" fill="#DC2626" opacity="0.3"/>
        <circle cx="0" cy="0" r="60" fill="#1C1917" stroke="#DC2626" stroke-width="3"/>
        <circle cx="0" cy="0" r="35" fill="#EF4444" filter="url(#glow-bullseye-blitz)"/>
        <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
        <!-- Starburst of score points -->
        <text x="0" y="7" fill="#DC2626" font-family="system-ui" font-size="14" font-weight="900" text-anchor="middle">100</text>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#DC2626" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#DC2626" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PHẢN XẠ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>