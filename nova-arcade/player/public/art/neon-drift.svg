<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-neon-drift" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#240718"/><stop offset="0.6" stop-color="#470C30"/><stop offset="1" stop-color="#12030C"/></linearGradient>
    <filter id="glow-neon-drift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-neon-drift)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#EC4899" opacity="0.12" filter="url(#glow-neon-drift)" />

  <!-- Focal Illustration -->
  
      <!-- Sideways Drifting Sports Car & Tire Smoke -->
      <g transform="translate(400, 240)">
        <!-- Curved Skid Marks -->
        <path d="M-150 70 Q -30 20 60 70" stroke="#F43F5E" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
        <path d="M-130 90 Q -10 40 80 90" stroke="#F43F5E" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
        <!-- Angled Drift Car Body -->
        <g transform="rotate(-18)">
          <rect x="-65" y="-20" width="130" height="45" rx="10" fill="#1F2937" stroke="#EC4899" stroke-width="3" filter="url(#glow-neon-drift)"/>
          <polygon points="-30,-20 -15,-40 25,-40 40,-20" fill="#111827" stroke="#F472B6" stroke-width="2"/>
          <!-- Neon Underglow -->
          <ellipse cx="0" cy="25" rx="65" ry="8" fill="#F43F5E" filter="url(#glow-neon-drift)"/>
        </g>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#EC4899" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ĐUA XE</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>