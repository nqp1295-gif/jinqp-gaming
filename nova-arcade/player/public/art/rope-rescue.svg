<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-rope-rescue" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#241005"/><stop offset="0.6" stop-color="#451F0A"/><stop offset="1" stop-color="#120702"/></linearGradient>
    <filter id="glow-rope-rescue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-rope-rescue)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#F97316" opacity="0.12" filter="url(#glow-rope-rescue)" />

  <!-- Focal Illustration -->
  
      <!-- Intertwined Climbing Ropes & Carabiner Clip -->
      <g transform="translate(400, 230)">
        <!-- Carabiner Hook -->
        <path d="M-30 -60 C-60 -60 -70 -20 -70 20 C-70 60 -40 70 0 70 C40 70 70 60 70 20 C70 -20 60 -60 30 -60" stroke="#FB923C" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow-rope-rescue)"/>
        <!-- Locking Gate -->
        <rect x="20" y="-30" width="16" height="40" rx="4" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
        <!-- Braided Rope Loops -->
        <path d="M-120 -80 Q-40 0 0 10 Q40 0 120 -80" stroke="#FDE047" stroke-width="5" stroke-dasharray="10 5" fill="none"/>
        <path d="M-120 80 Q-40 0 0 -10 Q40 0 120 80" stroke="#FDE047" stroke-width="5" stroke-dasharray="10 5" fill="none"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">GIẢI ĐỐ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>