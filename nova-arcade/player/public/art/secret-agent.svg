<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-secret-agent" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0F172A"/><stop offset="0.6" stop-color="#1E293B"/><stop offset="1" stop-color="#0A0E17"/></linearGradient>
    <filter id="glow-secret-agent" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-secret-agent)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#64748B" opacity="0.12" filter="url(#glow-secret-agent)" />

  <!-- Focal Illustration -->
  
      <!-- Night Vision Crosshairs & Spy Target -->
      <g transform="translate(400, 230)">
        <!-- Crosshair Radar Rings -->
        <circle cx="0" cy="0" r="105" stroke="#EF4444" stroke-width="2" fill="none" opacity="0.6"/>
        <circle cx="0" cy="0" r="70" stroke="#EF4444" stroke-width="2" fill="none" opacity="0.8"/>
        <circle cx="0" cy="0" r="30" stroke="#EF4444" stroke-width="3" fill="#EF4444" fill-opacity="0.15" filter="url(#glow-secret-agent)"/>
        <!-- Reticle Lines -->
        <line x1="-130" y1="0" x2="-40" y2="0" stroke="#EF4444" stroke-width="3"/>
        <line x1="40" y1="0" x2="130" y2="0" stroke="#EF4444" stroke-width="3"/>
        <line x1="0" y1="-130" x2="0" y2="-40" stroke="#EF4444" stroke-width="3"/>
        <line x1="0" y1="40" x2="0" y2="130" stroke="#EF4444" stroke-width="3"/>
        <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#64748B" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">HÀNH ĐỘNG</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>