<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-word-master" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#140826"/><stop offset="0.6" stop-color="#28114C"/><stop offset="1" stop-color="#0A0414"/></linearGradient>
    <filter id="glow-word-master" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-word-master)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#8B5CF6" opacity="0.12" filter="url(#glow-word-master)" />

  <!-- Focal Illustration -->
  
      <!-- Open Magical Grimoire & Glowing Runes -->
      <g transform="translate(400, 230)">
        <!-- Book Pages -->
        <path d="M0 30 C-40 10 -90 10 -130 25 L-130 -55 C-90 -70 -40 -70 0 -50 C40 -70 90 -70 130 -55 L130 25 C90 10 40 10 0 30 Z" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="3" filter="url(#glow-word-master)"/>
        <!-- Spine -->
        <line x1="0" y1="-50" x2="0" y2="30" stroke="#7C3AED" stroke-width="3"/>
        <!-- Glowing Runic Letters Floating Up -->
        <text x="-60" y="-10" fill="#6D28D9" font-family="serif" font-size="28" font-weight="bold">A B C</text>
        <text x="30" y="-10" fill="#6D28D9" font-family="serif" font-size="28" font-weight="bold">X Y Z</text>
        <text x="-25" y="-80" fill="#C4B5FD" font-family="monospace" font-size="24" font-weight="bold">Ψ Ω Σ</text>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#8B5CF6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">GIẢI ĐỐ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>