<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-turbo-highway" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#140826"/><stop offset="0.6" stop-color="#2D114D"/><stop offset="1" stop-color="#0A0414"/></linearGradient>
    <filter id="glow-turbo-highway" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-turbo-highway)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#00F0FF" opacity="0.12" filter="url(#glow-turbo-highway)" />

  <!-- Focal Illustration -->
  
      <!-- Perspective Speed Highway & Nitro Flame Supercar -->
      <g transform="translate(400, 260)">
        <!-- Highway lines -->
        <path d="M-300 150 L-60 -80 M300 150 L60 -80 M0 150 L0 -80" stroke="#FF2E93" stroke-width="3" stroke-opacity="0.6"/>
        <!-- Supercar Tail -->
        <g transform="translate(0, 40)">
          <path d="M-60 10 L-45 -15 Q0 -25 45 -15 L60 10 L50 25 Q0 30 -50 25 Z" fill="#18181B" stroke="#00F0FF" stroke-width="3"/>
          <path d="M-50 15 Q0 10 50 15" stroke="#FF0055" stroke-width="6" stroke-linecap="round"/>
          <!-- Dual Nitro Exhaust Flames -->
          <ellipse cx="-35" cy="28" rx="8" ry="18" fill="#00F0FF" filter="url(#glow-turbo-highway)"/>
          <ellipse cx="35" cy="28" rx="8" ry="18" fill="#00F0FF" filter="url(#glow-turbo-highway)"/>
        </g>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#00F0FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ĐUA XE</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>