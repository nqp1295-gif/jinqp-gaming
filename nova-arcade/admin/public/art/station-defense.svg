<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-station-defense" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#081426"/><stop offset="0.6" stop-color="#0F294D"/><stop offset="1" stop-color="#040A14"/></linearGradient>
    <filter id="glow-station-defense" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-station-defense)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#3B82F6" opacity="0.12" filter="url(#glow-station-defense)" />

  <!-- Focal Illustration -->
  
      <!-- Torus Space Station & Forcefield Barrier -->
      <g transform="translate(400, 230)">
        <!-- Protective Hex Forcefield Dome -->
        <circle cx="0" cy="0" r="120" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 8" fill="#1D4ED8" fill-opacity="0.1" filter="url(#glow-station-defense)"/>
        <!-- Torus Ring Station -->
        <circle cx="0" cy="0" r="60" stroke="#94A3B8" stroke-width="16" fill="none"/>
        <circle cx="0" cy="0" r="60" stroke="#3B82F6" stroke-width="4" fill="none"/>
        <!-- Central Hub -->
        <circle cx="0" cy="0" r="22" fill="#E2E8F0" stroke="#1D4ED8" stroke-width="3"/>
        <!-- 4 Station Spokes -->
        <line x1="-60" y1="0" x2="60" y2="0" stroke="#64748B" stroke-width="6"/>
        <line x1="0" y1="-60" x2="0" y2="60" stroke="#64748B" stroke-width="6"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">KHÔNG GIAN</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>