<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-cosmic-racer" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#140826"/><stop offset="0.6" stop-color="#28114C"/><stop offset="1" stop-color="#0A0414"/></linearGradient>
    <filter id="glow-cosmic-racer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-cosmic-racer)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#8B5CF6" opacity="0.12" filter="url(#glow-cosmic-racer)" />

  <!-- Focal Illustration -->
  
      <!-- Anti-gravity Hover Speeder & Space Raceway -->
      <g transform="translate(400, 230)">
        <!-- Hover Pod Body -->
        <polygon points="0,-90 40,-20 60,40 -60,40 -40,-20" fill="#6D28D9" stroke="#C4B5FD" stroke-width="3" filter="url(#glow-cosmic-racer)"/>
        <!-- Cockpit Glass -->
        <ellipse cx="0" cy="-15" rx="16" ry="30" fill="#00F0FF" opacity="0.8"/>
        <!-- Antigravity Rings -->
        <ellipse cx="-45" cy="45" rx="18" ry="6" fill="#A855F7" filter="url(#glow-cosmic-racer)"/>
        <ellipse cx="45" cy="45" rx="18" ry="6" fill="#A855F7" filter="url(#glow-cosmic-racer)"/>
        <!-- Plasma Trail -->
        <polygon points="-20,40 0,90 20,40" fill="#38BDF8" opacity="0.8"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#8B5CF6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ĐUA XE</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>