<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-logic-master" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#211704"/><stop offset="0.6" stop-color="#3D2B09"/><stop offset="1" stop-color="#120C02"/></linearGradient>
    <filter id="glow-logic-master" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-logic-master)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#EAB308" opacity="0.12" filter="url(#glow-logic-master)" />

  <!-- Focal Illustration -->
  
      <!-- Isometric Logic Cube & Brass Gears -->
      <g transform="translate(400, 230)">
        <!-- 3D Isometric Cube -->
        <!-- Top Face -->
        <polygon points="0,-70 65,-35 0,0 -65,-35" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
        <!-- Left Face -->
        <polygon points="-65,-35 0,0 0,75 -65,40" fill="#CA8A04" stroke="#A16207" stroke-width="2"/>
        <!-- Right Face -->
        <polygon points="0,0 65,-35 65,40 0,75" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
        <!-- Inner Cube grid lines -->
        <line x1="0" y1="-70" x2="0" y2="0" stroke="#A16207" stroke-width="1.5"/>
        <line x1="-32" y1="-52" x2="32" y2="-18" stroke="#A16207" stroke-width="1.5"/>
        <line x1="32" y1="-52" x2="-32" y2="-18" stroke="#A16207" stroke-width="1.5"/>
        <!-- Floating Gear Icons -->
        <g transform="translate(-130, -50) scale(0.6)">
          <circle cx="0" cy="0" r="30" fill="none" stroke="#FDE047" stroke-width="10" stroke-dasharray="14 10"/>
          <circle cx="0" cy="0" r="14" fill="#FDE047"/>
        </g>
        <g transform="translate(130, 40) scale(0.7)">
          <circle cx="0" cy="0" r="30" fill="none" stroke="#FDE047" stroke-width="10" stroke-dasharray="14 10"/>
          <circle cx="0" cy="0" r="14" fill="#FDE047"/>
        </g>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#EAB308" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">TRÍ TUỆ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>