<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-green-light-rush" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#031A0B"/><stop offset="0.6" stop-color="#083818"/><stop offset="1" stop-color="#010D05"/></linearGradient>
    <filter id="glow-green-light-rush" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-green-light-rush)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#22C55E" opacity="0.12" filter="url(#glow-green-light-rush)" />

  <!-- Focal Illustration -->
  
      <!-- Cyberpunk Traffic Light: Glowing Green GO -->
      <g transform="translate(400, 230)">
        <!-- Traffic Light Casing -->
        <rect x="-45" y="-105" width="90" height="210" rx="20" fill="#0F172A" stroke="#334155" stroke-width="3"/>
        <!-- Red Light (Dim) -->
        <circle cx="0" cy="-60" r="24" fill="#7F1D1D" stroke="#991B1B" stroke-width="2"/>
        <!-- Yellow Light (Dim) -->
        <circle cx="0" cy="0" r="24" fill="#78350F" stroke="#92400E" stroke-width="2"/>
        <!-- Green Light (BLAZING GO!) -->
        <circle cx="0" cy="60" r="26" fill="#22C55E" stroke="#86EFAC" stroke-width="3" filter="url(#glow-green-light-rush)"/>
        <circle cx="0" cy="60" r="12" fill="#FFFFFF"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#22C55E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PHẢN XẠ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>