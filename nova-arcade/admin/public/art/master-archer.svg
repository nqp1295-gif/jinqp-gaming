<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-master-archer" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#241604"/><stop offset="0.6" stop-color="#422908"/><stop offset="1" stop-color="#120A02"/></linearGradient>
    <filter id="glow-master-archer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-master-archer)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#F59E0B" opacity="0.12" filter="url(#glow-master-archer)" />

  <!-- Focal Illustration -->
  
      <!-- Golden Recurve Bow & Arrow -->
      <g transform="translate(400, 230)">
        <!-- Bow Curve -->
        <path d="M-40 -110 Q-100 0 -40 110" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow-master-archer)"/>
        <!-- Bow String -->
        <path d="M-40 -110 L25 0 L-40 110" stroke="#FEF3C7" stroke-width="2.5" fill="none"/>
        <!-- Arrow -->
        <line x1="-50" y1="0" x2="110" y2="0" stroke="#FFFFFF" stroke-width="4"/>
        <polygon points="110,0 85,-12 85,12" fill="#F59E0B"/>
        <!-- Arrow Fletching -->
        <path d="M-50 0 L-65 -12 M-50 0 L-65 12 M-40 0 L-55 -12 M-40 0 L-55 12" stroke="#FBBF24" stroke-width="3"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">HÀNH ĐỘNG</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>