<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-diamond-snatch" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#06182E"/><stop offset="0.6" stop-color="#0B2F57"/><stop offset="1" stop-color="#030C17"/></linearGradient>
    <filter id="glow-diamond-snatch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-diamond-snatch)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#38BDF8" opacity="0.12" filter="url(#glow-diamond-snatch)" />

  <!-- Focal Illustration -->
  
      <!-- Giant Cut Diamond on Pedestal -->
      <g transform="translate(400, 220)">
        <!-- Faceted Diamond -->
        <polygon points="-70,-30 70,-30 100,5 0,85 -100,5" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#glow-diamond-snatch)"/>
        <!-- Diamond Facet lines -->
        <polygon points="-40,-30 40,-30 55,5 0,85 -55,5" fill="#38BDF8" opacity="0.6"/>
        <polygon points="-20,-30 20,-30 0,5" fill="#E0F2FE"/>
        <line x1="-70" y1="-30" x2="-55" y2="5" stroke="#BAE6FD" stroke-width="2"/>
        <line x1="70" y1="-30" x2="55" y2="5" stroke="#BAE6FD" stroke-width="2"/>
        <line x1="-100" y1="5" x2="100" y2="5" stroke="#BAE6FD" stroke-width="2"/>
        <!-- Sparkle Star -->
        <path d="M50 -55 Q50 -35 70 -35 Q50 -35 50 -15 Q50 -35 30 -35 Q50 -35 50 -55" fill="#FFFFFF"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PHẢN XẠ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>