<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-dice-matcher" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#240712"/><stop offset="0.6" stop-color="#450C22"/><stop offset="1" stop-color="#120309"/></linearGradient>
    <filter id="glow-dice-matcher" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-dice-matcher)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#F43F5E" opacity="0.12" filter="url(#glow-dice-matcher)" />

  <!-- Focal Illustration -->
  
      <!-- Glowing 3D Casino Dice Pair -->
      <g transform="translate(400, 230)">
        <!-- Dice 1 (Left Angled) -->
        <g transform="translate(-40, -10) rotate(-15)">
          <rect x="-40" y="-40" width="80" height="80" rx="14" fill="#E11D48" stroke="#FFE4E6" stroke-width="3" filter="url(#glow-dice-matcher)"/>
          <!-- Five Dots -->
          <circle cx="-20" cy="-20" r="6" fill="#FFFFFF"/>
          <circle cx="20" cy="-20" r="6" fill="#FFFFFF"/>
          <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
          <circle cx="-20" cy="20" r="6" fill="#FFFFFF"/>
          <circle cx="20" cy="20" r="6" fill="#FFFFFF"/>
        </g>
        <!-- Dice 2 (Right Angled) -->
        <g transform="translate(50, 15) rotate(20)">
          <rect x="-35" y="-35" width="70" height="70" rx="12" fill="#BE123C" stroke="#FFE4E6" stroke-width="3"/>
          <!-- Six Dots -->
          <circle cx="-16" cy="-20" r="5" fill="#FFFFFF"/>
          <circle cx="-16" cy="0" r="5" fill="#FFFFFF"/>
          <circle cx="-16" cy="20" r="5" fill="#FFFFFF"/>
          <circle cx="16" cy="-20" r="5" fill="#FFFFFF"/>
          <circle cx="16" cy="0" r="5" fill="#FFFFFF"/>
          <circle cx="16" cy="20" r="5" fill="#FFFFFF"/>
        </g>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#F43F5E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">XẾP HÌNH</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>