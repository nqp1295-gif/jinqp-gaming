<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-ice-tetris" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#06182B"/><stop offset="0.6" stop-color="#0C3157"/><stop offset="1" stop-color="#030C17"/></linearGradient>
    <filter id="glow-ice-tetris" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-ice-tetris)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#38BDF8" opacity="0.12" filter="url(#glow-ice-tetris)" />

  <!-- Focal Illustration -->
  
      <!-- Crystalline Frozen Ice Bricks & Icicles -->
      <g transform="translate(400, 230)">
        <g filter="url(#glow-ice-tetris)">
          <!-- Ice Block 1 -->
          <rect x="-60" y="-40" width="45" height="45" rx="4" fill="#0284C7" stroke="#BAE6FD" stroke-width="2.5"/>
          <path d="M-60 -40 L-15 5" stroke="#E0F2FE" stroke-width="1.5"/>
          <!-- Ice Block 2 -->
          <rect x="-15" y="-40" width="45" height="45" rx="4" fill="#0369A1" stroke="#BAE6FD" stroke-width="2.5"/>
          <!-- Ice Block 3 -->
          <rect x="30" y="-40" width="45" height="45" rx="4" fill="#0284C7" stroke="#BAE6FD" stroke-width="2.5"/>
          <!-- Ice Block 4 on top -->
          <rect x="-15" y="-85" width="45" height="45" rx="4" fill="#38BDF8" stroke="#BAE6FD" stroke-width="2.5"/>
        </g>
        <!-- Icicles -->
        <polygon points="-50,5 -45,30 -40,5" fill="#E0F2FE"/>
        <polygon points="-5,5 0,40 5,5" fill="#E0F2FE"/>
        <polygon points="40,5 45,30 50,5" fill="#E0F2FE"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">XẾP HÌNH</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>