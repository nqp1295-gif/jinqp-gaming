<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-blocks" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#081426"/><stop offset="0.6" stop-color="#0E284C"/><stop offset="1" stop-color="#040A14"/></linearGradient>
    <filter id="glow-blocks" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-blocks)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#3B82F6" opacity="0.12" filter="url(#glow-blocks)" />

  <!-- Focal Illustration -->
  
      <!-- Classic Neon Tetromino Blocks Grid -->
      <g transform="translate(400, 230)">
        <!-- T-Shape Cyan -->
        <rect x="-60" y="-60" width="36" height="36" rx="6" fill="#00F0FF" stroke="#A5F3FC" stroke-width="2" filter="url(#glow-blocks)"/>
        <rect x="-20" y="-60" width="36" height="36" rx="6" fill="#00F0FF" stroke="#A5F3FC" stroke-width="2" filter="url(#glow-blocks)"/>
        <rect x="20" y="-60" width="36" height="36" rx="6" fill="#00F0FF" stroke="#A5F3FC" stroke-width="2" filter="url(#glow-blocks)"/>
        <rect x="-20" y="-20" width="36" height="36" rx="6" fill="#00F0FF" stroke="#A5F3FC" stroke-width="2" filter="url(#glow-blocks)"/>
        <!-- L-Shape Orange -->
        <rect x="-60" y="20" width="36" height="36" rx="6" fill="#F97316" stroke="#FED7AA" stroke-width="2"/>
        <rect x="-20" y="20" width="36" height="36" rx="6" fill="#F97316" stroke="#FED7AA" stroke-width="2"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#F97316" stroke="#FED7AA" stroke-width="2"/>
        <rect x="20" y="-20" width="36" height="36" rx="6" fill="#F97316" stroke="#FED7AA" stroke-width="2"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">XẾP HÌNH</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>