<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-mecha-assembly" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#041B26"/><stop offset="0.6" stop-color="#08374D"/><stop offset="1" stop-color="#020E14"/></linearGradient>
    <filter id="glow-mecha-assembly" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-mecha-assembly)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#06B6D4" opacity="0.12" filter="url(#glow-mecha-assembly)" />

  <!-- Focal Illustration -->
  
      <!-- Blueprint Schematics & Robot Fusion Core -->
      <g transform="translate(400, 230)">
        <!-- Blueprint Grid Square -->
        <rect x="-90" y="-90" width="180" height="180" rx="12" fill="#082F49" stroke="#0284C7" stroke-width="2"/>
        <line x1="-90" y1="0" x2="90" y2="0" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="0" y1="-90" x2="0" y2="90" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 4"/>
        <!-- Central Fusion Reactor Core -->
        <circle cx="0" cy="0" r="45" fill="#0C4A6E" stroke="#06B6D4" stroke-width="4" filter="url(#glow-mecha-assembly)"/>
        <circle cx="0" cy="0" r="25" fill="#38BDF8"/>
        <!-- Mechanical Assembly Gears -->
        <circle cx="0" cy="0" r="65" stroke="#38BDF8" stroke-width="6" stroke-dasharray="14 12" fill="none"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">XẾP HÌNH</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>