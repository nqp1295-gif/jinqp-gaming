<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="r-bg" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140A28"/>
      <stop offset="0.6" stop-color="#2D114D"/>
      <stop offset="1" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="r-grid" x1="400" y1="260" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2E93" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7928CA" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="r-car" x1="300" y1="320" x2="500" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7000FF"/>
      <stop offset="1" stop-color="#FF007A"/>
    </linearGradient>
    <radialGradient id="r-sun" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FFE600"/>
      <stop offset="0.4" stop-color="#FF007A"/>
      <stop offset="1" stop-color="#7000FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#r-bg)"/>
  <!-- Synthwave Sun -->
  <circle cx="400" cy="240" r="120" fill="url(#r-sun)"/>
  <!-- Horizon line -->
  <line x1="0" y1="260" x2="800" y2="260" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Perspective Road Grid -->
  <path d="M0 500 L320 260 M100 500 L340 260 M250 500 L370 260 M400 500 L400 260 M550 500 L430 260 M700 500 L460 260 M800 500 L480 260" stroke="url(#r-grid)" stroke-width="2"/>
  <line x1="160" y1="420" x2="640" y2="420" stroke="#FF2E93" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="250" y1="360" x2="550" y2="360" stroke="#FF2E93" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="310" y1="310" x2="490" y2="310" stroke="#FF2E93" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="350" y1="280" x2="450" y2="280" stroke="#FF2E93" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Speed lines -->
  <path d="M40 380 H220 M580 380 H760 M80 330 H260 M540 330 H720 M140 430 H280 M520 430 H660" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Supercar Body -->
  <g transform="translate(400, 375)">
    <!-- Rear Glow / Exhaust -->
    <ellipse cx="-45" cy="20" rx="14" ry="6" fill="#00F0FF" filter="blur(4px)"/>
    <ellipse cx="45" cy="20" rx="14" ry="6" fill="#00F0FF" filter="blur(4px)"/>
    <ellipse cx="0" cy="18" rx="80" ry="12" fill="#FF0055" filter="blur(6px)"/>
    <!-- Spoiler -->
    <path d="M-85 -10 L-65 -22 H65 L85 -10 L75 -5 H-75 Z" fill="#1A102E" stroke="#FF007A" stroke-width="2"/>
    <rect x="-60" y="-12" width="8" height="15" fill="#110B1F"/>
    <rect x="52" y="-12" width="8" height="15" fill="#110B1F"/>
    <!-- Main Chassis Back -->
    <path d="M-80 15 L-65 -8 Q0 -15 65 -8 L80 15 L70 30 Q0 35 -70 30 Z" fill="url(#r-car)" stroke="#00F0FF" stroke-width="2"/>
    <!-- Cabin Roof / Rear Window -->
    <path d="M-40 -8 L-30 -35 Q0 -42 30 -35 L40 -8 Z" fill="#0B0616" stroke="#00F0FF" stroke-width="2"/>
    <path d="M-25 -10 L-18 -30 Q0 -34 18 -30 L25 -10 Z" fill="#00F0FF" fill-opacity="0.3"/>
    <!-- Taillights Bar -->
    <path d="M-68 8 Q0 4 68 8" stroke="#FF0055" stroke-width="6" stroke-linecap="round"/>
    <path d="M-68 8 Q0 4 68 8" stroke="#FFE600" stroke-width="2" stroke-linecap="round"/>
    <!-- Tires -->
    <rect x="-95" y="5" width="22" height="35" rx="5" fill="#0A0713" stroke="#332454" stroke-width="2"/>
    <rect x="73" y="5" width="22" height="35" rx="5" fill="#0A0713" stroke="#332454" stroke-width="2"/>
  </g>
</svg>
