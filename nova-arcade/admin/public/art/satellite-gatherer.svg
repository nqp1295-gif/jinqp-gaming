<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-satellite-gatherer" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#041A24"/><stop offset="0.6" stop-color="#083447"/><stop offset="1" stop-color="#020E13"/></linearGradient>
    <filter id="glow-satellite-gatherer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-satellite-gatherer)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#06B6D4" opacity="0.12" filter="url(#glow-satellite-gatherer)" />

  <!-- Focal Illustration -->
  
      <!-- Orbital Satellite with Blue Solar Wings -->
      <g transform="translate(400, 230)">
        <!-- Satellite Main Chassis -->
        <rect x="-25" y="-30" width="50" height="60" rx="6" fill="#E2E8F0" stroke="#06B6D4" stroke-width="2.5" filter="url(#glow-satellite-gatherer)"/>
        <circle cx="0" cy="0" r="10" fill="#0284C7"/>
        <!-- Left Solar Wing -->
        <rect x="-115" y="-20" width="80" height="40" rx="4" fill="#0369A1" stroke="#38BDF8" stroke-width="2"/>
        <line x1="-75" y1="-20" x2="-75" y2="20" stroke="#67E8F9" stroke-width="1.5"/>
        <line x1="-115" y1="0" x2="-35" y2="0" stroke="#67E8F9" stroke-width="1.5"/>
        <!-- Right Solar Wing -->
        <rect x="35" y="-20" width="80" height="40" rx="4" fill="#0369A1" stroke="#38BDF8" stroke-width="2"/>
        <line x1="75" y1="-20" x2="75" y2="20" stroke="#67E8F9" stroke-width="1.5"/>
        <line x1="35" y1="0" x2="115" y2="0" stroke="#67E8F9" stroke-width="1.5"/>
        <!-- Dish Antenna -->
        <path d="M-15 -30 Q0 -55 15 -30" stroke="#FACC15" stroke-width="3" fill="none"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">KHÔNG GIAN</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>