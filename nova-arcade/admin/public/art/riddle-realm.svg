<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-riddle-realm" x2="800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#190A2E"/><stop offset="0.6" stop-color="#311259"/><stop offset="1" stop-color="#0D0417"/></linearGradient>
    <filter id="glow-riddle-realm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-riddle-realm)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="240" r="190" fill="#C084FC" opacity="0.12" filter="url(#glow-riddle-realm)" />

  <!-- Focal Illustration -->
  
      <!-- Mystic Portal & Giant Radiant Question Mark -->
      <g transform="translate(400, 230)">
        <!-- Arch Portal -->
        <path d="M-80 90 V-10 C-80 -70 80 -70 80 -10 V90" stroke="#A855F7" stroke-width="6" fill="#3B0764" fill-opacity="0.4" filter="url(#glow-riddle-realm)"/>
        <!-- Glowing Question Mark -->
        <path d="M-25 -35 C-25 -65 25 -65 25 -35 C25 -15 0 -10 0 15" stroke="#F472B6" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow-riddle-realm)"/>
        <circle cx="0" cy="45" r="7" fill="#F472B6" filter="url(#glow-riddle-realm)"/>
      </g>

  <!-- Category & Game Branding Accent -->
  <g transform="translate(40, 420)">
    <rect width="130" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="20" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">GIẢI ĐỐ</text>
  </g>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
</svg>